[package]
name = "haber-masaustu"
version = "0.2.0"
edition = "2021"

[lib]
name = "haber_masaustu_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "image-ico"] }
tauri-plugin-http = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-notification = "2"
tauri-plugin-os = "2"
tauri-plugin-opener = "2"
url = "2"

# Kilit ekranı için işletim sisteminin boşta kalma süresi (Windows).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_UI_Input_KeyboardAndMouse", "Win32_System_SystemInformation"] }

# Açılışta otomatik başlat (yalnız masaüstü).
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-autostart = "2"
