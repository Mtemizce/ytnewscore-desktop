# Sürüm paketleri: bir vX.Y.Z etiketi itilince Windows (.msi + .exe), macOS (.dmg) ve Linux (.deb, .rpm, .AppImage)
# kurulum dosyaları üretilip aynı adlı GitHub sürümüne eklenir. Sürüm notu etiketin mesajından alınır.
name: Sürüm paketleri

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ''
          - platform: macos-latest
            args: '--target universal-apple-darwin'
          - platform: ubuntu-22.04
            args: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sürüm notunu etiket mesajından al
        id: notes
        shell: bash
        run: |
          git fetch --tags --force
          TAG="${GITHUB_REF_NAME}"
          {
            echo 'body<<NOTES_EOF'
            git tag -l --format='%(contents)' "$TAG"
            echo 'NOTES_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Linux bağımlılıkları
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libgtk-3-dev libssl-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'YTNewsCore Masaüstü ${{ github.ref_name }}'
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
