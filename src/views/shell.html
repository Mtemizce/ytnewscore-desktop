<div class="shell">
  <aside class="sidebar">
    <div class="brand">
      <span class="brand-mark">YT</span>
      <span>YTNews<b>Core</b></span>
    </div>
    <nav class="nav">
      <template x-for="s in sections" :key="s.key">
        <button type="button" class="nav-item" :class="{ 'is-active': $store.ui.section === s.key }" @click="go(s.key)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path :d="s.icon"/></svg>
          <span x-text="s.label"></span>
        </button>
      </template>
    </nav>
    <div class="sidebar-foot" x-text="serverName" :title="login.baseUrl"></div>
  </aside>

  <div class="main">
    <header class="topbar">
      <h1 x-text="title"></h1>
      <div class="topbar-actions">
        <!-- @include partials/bell -->
        <button type="button" class="icon-btn" @click="toggleFullscreen()" :title="fullscreen ? 'Tam ekrandan çık (F11)' : 'Tam ekran (F11)'">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path x-show="!fullscreen" d="M3.75 3.75v4.5m0-4.5h4.5m-4.5 0L9 9M3.75 20.25v-4.5m0 4.5h4.5m-4.5 0L9 15M20.25 3.75h-4.5m4.5 0v4.5m0-4.5L15 9m5.25 11.25h-4.5m4.5 0v-4.5m0 4.5L15 15"/><path x-show="fullscreen" d="M9 9V4.5M9 9H4.5M9 9 3.75 3.75M9 15v4.5M9 15H4.5M9 15l-5.25 5.25M15 9h4.5M15 9V4.5M15 9l5.25-5.25M15 15h4.5M15 15v4.5m0-4.5 5.25 5.25"/></svg>
        </button>
        <button type="button" class="icon-btn" @click="toggleWidget()" title="Masaüstü widget'ı">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3.75 3v11.25A2.25 2.25 0 0 0 6 16.5h2.25M3.75 3h-1.5m1.5 0h16.5m0 0h1.5m-1.5 0v11.25A2.25 2.25 0 0 1 18 16.5h-2.25m-7.5 0h7.5m-7.5 0-1 3m8.5-3 1 3m0 0 .5 1.5m-.5-1.5h-9.5m0 0-.5 1.5m.75-9 3-3 2.148 2.148A12.061 12.061 0 0 1 16.5 7.605"/></svg>
        </button>
        <button type="button" class="icon-btn" @click="lock()" title="Kilitle (Ctrl+L)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M16.5 10.5V6.75a4.5 4.5 0 1 0-9 0v3.75m-.75 11.25h10.5a2.25 2.25 0 0 0 2.25-2.25v-6.75a2.25 2.25 0 0 0-2.25-2.25H6.75a2.25 2.25 0 0 0-2.25 2.25v6.75a2.25 2.25 0 0 0 2.25 2.25Z"/></svg>
        </button>
        <button type="button" class="user-chip" @click="go('profile')" :title="user?.email">
          <img class="avatar" x-show="user?.avatar_url" :src="user?.avatar_url" alt="">
          <span class="avatar" x-show="!user?.avatar_url" x-text="initials(user?.name)"></span>
          <span x-text="user?.name"></span>
        </button>
        <button type="button" class="btn btn-ghost btn-sm" @click="logout">Çıkış</button>
      </div>
    </header>

    <main class="content">
      <div x-show="$store.ui.section === 'dashboard'"><!-- @include sections/dashboard --></div>
      <template x-if="$store.auth.can(['news.create', 'news.edit-own', 'news.edit-published', 'news.approve'])">
        <div x-show="$store.ui.section === 'news'"><!-- @include sections/content kind=news --></div>
      </template>
      <template x-if="$store.auth.can(['article.create', 'article.edit-own', 'article.edit-published', 'article.approve'])">
        <div x-show="$store.ui.section === 'articles'"><!-- @include sections/content kind=articles --></div>
      </template>
      <template x-if="$store.auth.can('ingestion.manage')">
        <div x-show="$store.ui.section === 'inbox'"><!-- @include sections/inbox --></div>
      </template>
      <template x-if="$store.auth.can('comments.moderate')">
        <div x-show="$store.ui.section === 'comments'"><!-- @include sections/comments --></div>
      </template>
      <template x-if="$store.auth.can('forms.view')">
        <div x-show="$store.ui.section === 'forms'"><!-- @include sections/forms --></div>
      </template>
      <div x-show="$store.ui.section === 'pages'"><!-- @include sections/pages --></div>
      <template x-if="$store.auth.can('ads.view')">
        <div x-show="$store.ui.section === 'ads'"><!-- @include sections/ads --></div>
      </template>
      <template x-if="$store.auth.can(['social.manage', 'notifications.settings.manage'])">
        <div x-show="$store.ui.section === 'social'"><!-- @include sections/social --></div>
      </template>
      <template x-if="$store.auth.can('settings.users.view')">
        <div x-show="$store.ui.section === 'users'"><!-- @include sections/users --></div>
      </template>
      <div x-show="$store.ui.section === 'profile'"><!-- @include sections/profile --></div>
    </main>
  </div>
</div>
