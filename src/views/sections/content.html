<section x-data="contentSection('{{kind}}')" class="card">
  <div class="toolbar">
    <input class="input toolbar-search" type="search" placeholder="Başlıkta ara…" x-model="search" @input="refilter(true)">
    <select class="input" x-model="filters.status" @change="refilter()">
      <option value="">Tüm durumlar</option>
      <option value="published">Yayında</option>
      <option value="pending_review">İncelemede</option>
      <option value="draft">Taslak</option>
    </select>
    <select class="input" x-model="filters.category_id" @change="refilter()" x-show="categories.length">
      <option value="">Tüm kategoriler</option>
      <template x-for="c in categories" :key="c.id"><option :value="c.id" x-text="c.name"></option></template>
    </select>
    <div class="toolbar-spacer"></div>
    <button type="button" class="icon-btn" title="Yenile" @click="reload()" :class="{ 'is-spinning': loading }">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M16.023 9.348h4.992V4.356M2.985 19.644v-4.992h4.992m0 0 3.181 3.183a8.25 8.25 0 0 0 13.803-3.7M4.031 9.865a8.25 8.25 0 0 1 13.803-3.7l3.181 3.182"/></svg>
    </button>
    <button type="button" class="btn btn-primary" x-show="can('create')" :disabled="opening" @click="openCreate()">+ Yeni <span x-text="singular"></span></button>
  </div>

  <p class="alert alert-error" x-show="listError" x-text="listError"></p>

  <div class="table-wrap" :class="{ 'is-loading': loading }">
    <table class="table">
      <thead>
        <tr>
          <th class="col-id">#</th>
          <th>Başlık</th>
          <th>Kategori</th>
          <th>Durum</th>
          <th>Yayın</th>
          <th class="col-actions">İşlemler</th>
        </tr>
      </thead>
      <tbody>
        <template x-for="item in items" :key="item.id">
          <tr>
            <td class="col-id" x-text="item.id"></td>
            <td>
              <button type="button" class="cell-title" @click="openEdit(item)" x-text="item.title"></button>
              <div class="cell-flags">
                <template x-for="f in flags" :key="f.key">
                  <span class="badge badge-indigo" x-show="item[f.key]" x-text="f.label"></span>
                </template>
              </div>
            </td>
            <td x-text="item.category?.name || '—'"></td>
            <td><span class="badge" :class="statusBadge(item.status)" x-text="item.status_label || item.status"></span></td>
            <td class="nowrap" x-text="formatDate(item.released_at || item.created_at)"></td>
            <td class="col-actions">
              <button type="button" class="btn btn-ghost btn-sm" @click="openEdit(item)">Düzenle</button>
              <button type="button" class="btn btn-ghost btn-sm" x-show="item.status === 'published'" @click="reshare(item)" title="Sosyal medyada ve Telegram'da yeniden paylaş">Paylaş</button>
              <button type="button" class="btn btn-ghost-danger btn-sm" x-show="can('delete')" @click="remove(item)">Sil</button>
            </td>
          </tr>
        </template>
        <tr x-show="loaded && !items.length">
          <td colspan="6" class="empty">Kayıt bulunamadı.</td>
        </tr>
      </tbody>
    </table>
  </div>

  <!-- @include partials/pager -->
</section>
