<section x-data="adsSection()" class="card">
  <div class="tabs">
    <button type="button" class="tab" :class="{ 'is-active': tab === 'creatives' }" @click="tab = 'creatives'">Reklamlar <span class="tab-count" x-text="meta.total"></span></button>
    <button type="button" class="tab" :class="{ 'is-active': tab === 'zones' }" @click="tab = 'zones'">Alanlar <span class="tab-count" x-text="zones.length"></span></button>
  </div>

  <!-- Reklamlar -->
  <div x-show="tab === 'creatives'">
    <div class="toolbar">
      <input class="input toolbar-search" type="search" placeholder="Başlık ya da reklam veren…" x-model="search" @input="refilter(true)">
      <select class="input" x-model="filters.ad_zone_id" @change="refilter()">
        <option value="">Tüm alanlar</option>
        <template x-for="z in zones" :key="z.id"><option :value="z.id" x-text="z.name"></option></template>
      </select>
      <select class="input" x-model="filters.state" @change="refilter()">
        <option value="">Tümü</option>
        <option value="active">Etkin</option>
        <option value="inactive">Pasif</option>
      </select>
      <div class="toolbar-spacer"></div>
      <button type="button" class="icon-btn" title="Yenile" @click="reload()" :class="{ 'is-spinning': loading }">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M16.023 9.348h4.992V4.356M2.985 19.644v-4.992h4.992m0 0 3.181 3.183a8.25 8.25 0 0 0 13.803-3.7M4.031 9.865a8.25 8.25 0 0 1 13.803-3.7l3.181 3.182"/></svg>
      </button>
      <button type="button" class="btn btn-primary" x-show="can('create')" @click="openCreate()">+ Yeni Reklam</button>
    </div>

    <p class="alert alert-error" x-show="listError" x-text="listError"></p>

    <div class="table-wrap" :class="{ 'is-loading': loading }">
      <table class="table">
        <thead>
          <tr>
            <th class="col-thumb"></th>
            <th>Reklam</th>
            <th>Alan</th>
            <th>Yayın aralığı</th>
            <th class="num">Gösterim</th>
            <th class="num">Tıklama</th>
            <th class="num">TO</th>
            <th>Etkin</th>
            <th>Ücretli</th>
            <th class="col-actions">İşlemler</th>
          </tr>
        </thead>
        <tbody>
          <template x-for="ad in items" :key="ad.id">
            <tr>
              <td class="col-thumb">
                <img class="ad-thumb" x-show="ad.display_image_url" :src="ad.display_image_url" alt="">
                <span class="ad-thumb ad-thumb-html" x-show="!ad.display_image_url" x-text="ad.type === 'html' ? 'HTML' : '—'"></span>
              </td>
              <td>
                <button type="button" class="cell-title" @click="ad.is_editable && can('update') && openEdit(ad)" x-text="ad.title"></button>
                <div class="muted" x-text="[ad.advertiser_name, ad.type_label].filter(Boolean).join(' · ')"></div>
                <span class="badge badge-green" x-show="ad.is_running">Yayında</span>
              </td>
              <td x-text="ad.zone?.name || '—'"></td>
              <td class="nowrap muted" x-text="period(ad)"></td>
              <td class="num" x-text="ad.impression_count.toLocaleString('tr-TR') + (ad.impression_limit ? ' / ' + ad.impression_limit.toLocaleString('tr-TR') : '')"></td>
              <td class="num" x-text="ad.click_count.toLocaleString('tr-TR') + (ad.click_limit ? ' / ' + ad.click_limit.toLocaleString('tr-TR') : '')"></td>
              <td class="num" x-text="'%' + ad.ctr.toLocaleString('tr-TR')"></td>
              <td>
                <label class="toggle"><input type="checkbox" :checked="ad.is_active" :disabled="!ad.is_editable || !can('update')" @change="run('toggleActive', ad.id)"><span class="toggle-track"></span></label>
              </td>
              <td>
                <label class="toggle"><input type="checkbox" :checked="ad.is_paid" :disabled="!ad.is_editable || !can('update')" @change="run('togglePaid', ad.id)"><span class="toggle-track"></span></label>
              </td>
              <td class="col-actions">
                <div class="action-row" x-show="ad.is_editable">
                  <button type="button" class="btn btn-ghost btn-sm" title="Yukarı" x-show="can('update')" @click="run('move', ad.id, 'up')">↑</button>
                  <button type="button" class="btn btn-ghost btn-sm" title="Aşağı" x-show="can('update')" @click="run('move', ad.id, 'down')">↓</button>
                  <button type="button" class="btn btn-ghost btn-sm" x-show="can('update')" @click="openEdit(ad)">Düzenle</button>
                  <button type="button" class="btn btn-ghost-danger btn-sm" x-show="can('delete')" @click="remove(ad)">Sil</button>
                </div>
                <span class="muted" x-show="!ad.is_editable">Duyurular'dan yönetilir</span>
              </td>
            </tr>
          </template>
          <tr x-show="loaded && !items.length"><td colspan="10" class="empty">Reklam yok.</td></tr>
        </tbody>
      </table>
    </div>

    <!-- @include partials/pager -->
  </div>

  <!-- Alanlar -->
  <div x-show="tab === 'zones'" class="table-wrap">
    <table class="table">
      <thead>
        <tr><th>Alan</th><th>Ölçü</th><th class="num">Reklam</th><th>Boş alan metni</th><th>Etkin</th><th class="col-actions"></th></tr>
      </thead>
      <tbody>
        <template x-for="z in zones" :key="z.id">
          <tr>
            <td><div class="cell-strong" x-text="z.name"></div><div class="muted mono" x-text="z.key"></div></td>
            <td class="nowrap" x-text="z.width && z.height ? z.width + '×' + z.height : '—'"></td>
            <td class="num" x-text="z.creative_count"></td>
            <td class="muted" x-text="z.skeleton_text || '—'"></td>
            <td><label class="toggle"><input type="checkbox" :checked="z.is_active" :disabled="!can('update')" @change="toggleZone(z)"><span class="toggle-track"></span></label></td>
            <td class="col-actions"><button type="button" class="btn btn-ghost btn-sm" x-show="can('update')" @click="editZone(z)">Düzenle</button></td>
          </tr>
        </template>
      </tbody>
    </table>
  </div>

  <!-- @include sections/ads-form -->

  <div class="modal-backdrop" x-show="zoneEdit" x-transition.opacity @keydown.escape.window="zoneEdit = null">
    <form class="modal modal-sm" @submit.prevent="saveZone()">
      <div class="modal-head"><h2>Alanı Düzenle</h2><button type="button" class="icon-btn" @click="zoneEdit = null">✕</button></div>
      <template x-if="zoneEdit">
        <div class="modal-body">
          <label class="field"><span>Ad</span><input class="input" x-model="zoneEdit.name" required maxlength="255"></label>
          <label class="field"><span>Açıklama</span><textarea class="input" rows="2" x-model="zoneEdit.description" maxlength="1000"></textarea></label>
          <label class="field"><span>Boş alan metni</span><input class="input" x-model="zoneEdit.skeleton_text" maxlength="120" placeholder="Reklam Alanı"></label>
        </div>
      </template>
      <div class="modal-foot"><button type="button" class="btn btn-ghost" @click="zoneEdit = null">Vazgeç</button><button class="btn btn-primary">Kaydet</button></div>
    </form>
  </div>
</section>
