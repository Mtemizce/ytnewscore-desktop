<div x-data="dashboardSection()" class="dashboard">
  <div class="dash-head">
    <span class="muted" x-text="$store.stats.updatedAt ? 'Güncellendi: ' + formatDate($store.stats.updatedAt) : ''"></span>
    <div class="toolbar-spacer"></div>
    <button type="button" class="icon-btn" title="Yenile" @click="refresh()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M16.023 9.348h4.992V4.356M2.985 19.644v-4.992h4.992m0 0 3.181 3.183a8.25 8.25 0 0 0 13.803-3.7M4.031 9.865a8.25 8.25 0 0 1 13.803-3.7l3.181 3.182"/></svg>
    </button>
  </div>

  <p class="alert alert-error" x-show="$store.stats.error" x-text="$store.stats.error"></p>

  <div class="stat-grid">
    <template x-for="c in cards" :key="c.key">
      <div class="stat-card" :class="{ 'is-alert': c.alert && Number($store.stats.counts[c.key]) > 0 }">
        <span class="stat-label" x-text="c.label"></span>
        <span class="stat-value" x-text="$store.stats.value(c.key)"></span>
        <span class="muted" x-show="c.hint" x-text="c.hint"></span>
      </div>
    </template>
  </div>

  <section class="card">
    <div class="card-head">
      Sunucu Durumu
      <span class="badge" :class="$store.stats.allServicesUp ? 'badge-green' : 'badge-red'" x-text="$store.stats.allServicesUp ? 'Tüm servisler çalışıyor' : 'Sorun var'"></span>
    </div>
    <div class="card-body">
      <div class="service-list">
        <template x-for="s in services" :key="s.key">
          <div class="service">
            <span class="dot" :class="$store.stats.services[s.key] ? 'dot-on' : 'dot-off'"></span>
            <span x-text="s.label"></span>
            <span class="muted" x-text="$store.stats.services[s.key] ? 'Çalışıyor' : 'Yanıt yok'"></span>
          </div>
        </template>
      </div>

      <p class="alert alert-error" x-show="serverError" x-text="serverError"></p>

      <template x-if="server">
        <div class="server-grid">
          <div><span class="stat-label">Disk</span><div class="meter"><span :style="'width:' + diskPercent() + '%'" :class="{ 'is-high': diskPercent() > 85 }"></span></div><span class="muted" x-text="bytes(server.disk.total - server.disk.free) + ' / ' + bytes(server.disk.total) + ' (%' + diskPercent() + ')'"></span></div>
          <div><span class="stat-label">Veritabanı</span><span x-text="bytes(server.database.size) + ' · ' + server.database.tables + ' tablo'"></span></div>
          <div><span class="stat-label">Bekleyen iş</span><span x-text="server.jobs.pending"></span></div>
          <div><span class="stat-label">Başarısız iş</span><span :class="{ 'text-danger': server.jobs.failed > 0 }" x-text="server.jobs.failed"></span></div>
          <div><span class="stat-label">Önbellek</span><span x-text="bytes(server.cache_size)"></span></div>
          <div><span class="stat-label">Günlük dosyası</span><span x-text="bytes(server.log_size)"></span></div>
          <div><span class="stat-label">PHP / Laravel</span><span x-text="server.php_version + ' / ' + server.laravel_version"></span></div>
          <div><span class="stat-label">Sürüm</span><span x-text="server.app_version || '—'"></span></div>
          <div x-show="server.load"><span class="stat-label">Sunucu yükü (1/5/15 dk)</span><span x-text="(server.load || []).map(n => n.toFixed(2)).join(' · ')"></span></div>
          <div><span class="stat-label">Sunucu saati</span><span x-text="formatDate(server.time)"></span></div>
        </div>
      </template>
      <p class="hint" x-show="!$store.auth.can('backend.system-maintenance.view')">Ayrıntılı sunucu bilgisi için "Sistem Bakımı" görüntüleme izni gerekir.</p>
    </div>
  </section>
</div>
