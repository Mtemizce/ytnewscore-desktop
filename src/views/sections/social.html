<section x-data="socialSection()" class="card">
  <div class="tabs">
    <button type="button" class="tab" x-show="$store.auth.can('social.manage')" :class="{ 'is-active': tab === 'history' }" @click="tab = 'history'">Paylaşım Geçmişi <span class="tab-count" x-text="meta.total"></span></button>
    <button type="button" class="tab" x-show="$store.auth.can('social.manage')" :class="{ 'is-active': tab === 'platforms' }" @click="tab = 'platforms'">Platformlar</button>
    <button type="button" class="tab" x-show="$store.auth.can('notifications.settings.manage')" :class="{ 'is-active': tab === 'channels' }" @click="tab = 'channels'">Telegram Kanalları <span class="tab-count" x-text="channels.length"></span></button>
  </div>

  <!-- Geçmiş -->
  <div x-show="tab === 'history'">
    <div class="toolbar">
      <input class="input toolbar-search" type="search" placeholder="İçerik başlığı…" x-model="search" @input="refilter(true)">
      <select class="input" x-model="filters.platform" @change="refilter()">
        <option value="">Tüm platformlar</option>
        <option value="telegram">Telegram</option>
        <option value="facebook">Facebook</option>
        <option value="instagram">Instagram</option>
        <option value="twitter">X (Twitter)</option>
      </select>
      <select class="input" x-model="filters.status" @change="refilter()">
        <option value="">Tüm durumlar</option>
        <option value="success">Başarılı</option>
        <option value="failed">Başarısız</option>
        <option value="skipped">Atlandı</option>
        <option value="deleted">Silindi</option>
      </select>
      <div class="toolbar-spacer"></div>
      <button type="button" class="icon-btn" title="Yenile" @click="reload()" :class="{ 'is-spinning': loading }">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M16.023 9.348h4.992V4.356M2.985 19.644v-4.992h4.992m0 0 3.181 3.183a8.25 8.25 0 0 0 13.803-3.7M4.031 9.865a8.25 8.25 0 0 1 13.803-3.7l3.181 3.182"/></svg>
      </button>
    </div>
    <div class="table-wrap" :class="{ 'is-loading': loading }">
      <table class="table">
        <thead><tr><th>Tarih</th><th>Platform</th><th>İçerik</th><th>Durum</th><th>Hata</th><th class="col-actions"></th></tr></thead>
        <tbody>
          <template x-for="log in items" :key="log.id">
            <tr>
              <td class="nowrap" x-text="formatDate(log.created_at)"></td>
              <td x-text="log.platform_label"></td>
              <td><div class="cell-strong" x-text="log.content_title"></div><div class="muted" x-text="log.content_type === 'article' ? 'Köşe yazısı' : 'Haber'"></div></td>
              <td><span class="badge" :class="statusBadge(log.status)" x-text="log.status_label"></span></td>
              <td class="muted" x-text="log.error_message || '—'"></td>
              <td class="col-actions"><button type="button" class="btn btn-ghost-danger btn-sm" @click="removeShare(log)">Sil</button></td>
            </tr>
          </template>
          <tr x-show="loaded && !items.length"><td colspan="6" class="empty">Paylaşım kaydı yok.</td></tr>
        </tbody>
      </table>
    </div>
    <!-- @include partials/pager -->
  </div>

  <!-- Platformlar -->
  <div x-show="tab === 'platforms'">
    <div class="platform-grid">
      <template x-for="p in platforms" :key="p.platform">
        <div class="platform-card">
          <div class="cell-strong" x-text="p.label"></div>
          <span class="badge" :class="p.connected ? 'badge-green' : 'badge-slate'" x-text="p.connected ? 'Bağlı' : 'Bağlı değil'"></span>
          <div class="muted" x-show="p.account_name" x-text="p.account_name"></div>
          <div class="muted" x-show="p.skip_auto_share">Otomatik paylaşım kapalı</div>
          <div class="muted" x-show="p.token_expires_at" x-text="'Bağlantı bitişi: ' + formatDate(p.token_expires_at)"></div>
        </div>
      </template>
    </div>
    <div class="toolbar">
      <span class="muted">Hesap bağlama ve otomatik paylaşım ayarları panelde.</span>
      <div class="toolbar-spacer"></div>
      <button type="button" class="btn btn-ghost btn-sm" @click="openSocialSettings()">Panelde aç</button>
    </div>
  </div>

  <!-- Telegram kanalları -->
  <div x-show="tab === 'channels'">
    <div class="toolbar">
      <span class="muted">Yayınlanan haber ve köşe yazıları bu kanallara gönderilir.</span>
      <div class="toolbar-spacer"></div>
      <button type="button" class="btn btn-primary" @click="newChannel()">+ Kanal Ekle</button>
    </div>
    <div class="table-wrap">
      <table class="table">
        <thead><tr><th>Kanal</th><th>Chat ID</th><th>Bağlantı</th><th>Etkin</th><th class="col-actions"></th></tr></thead>
        <tbody>
          <template x-for="c in channels" :key="c.id">
            <tr>
              <td class="cell-strong" x-text="c.name"></td>
              <td class="mono muted" x-text="c.chat_id"></td>
              <td class="muted" x-text="c.public_url || '—'"></td>
              <td><label class="toggle"><input type="checkbox" :checked="c.is_active" @change="toggleChannel(c)"><span class="toggle-track"></span></label></td>
              <td class="col-actions">
                <div class="action-row">
                  <button type="button" class="btn btn-ghost btn-sm" @click="editChannel(c)">Düzenle</button>
                  <button type="button" class="btn btn-ghost-danger btn-sm" @click="removeChannel(c)">Sil</button>
                </div>
              </td>
            </tr>
          </template>
          <tr x-show="!channels.length"><td colspan="5" class="empty">Telegram kanalı yok.</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <div class="modal-backdrop" x-show="channel" x-transition.opacity @keydown.escape.window="channel = null">
    <form class="modal modal-sm" @submit.prevent="saveChannel()">
      <div class="modal-head"><h2 x-text="channel?.id ? 'Kanalı Düzenle' : 'Telegram Kanalı Ekle'"></h2><button type="button" class="icon-btn" @click="channel = null">✕</button></div>
      <template x-if="channel">
        <div class="modal-body">
          <label class="field"><span>Ad</span><input class="input" x-model="channel.name" required maxlength="255"><small class="error" x-text="channelError('name')"></small></label>
          <label class="field"><span>Chat ID <small class="muted">(ör. -1001234567890 ya da @kanaladi)</small></span><input class="input mono" x-model="channel.chat_id" required maxlength="255"><small class="error" x-text="channelError('chat_id')"></small></label>
          <label class="field"><span>Ziyaretçi bağlantısı <small class="muted">(https://t.me/…)</small></span><input class="input" x-model="channel.public_url" maxlength="255"><small class="error" x-text="channelError('public_url')"></small></label>
          <label class="toggle"><input type="checkbox" x-model="channel.is_active"><span class="toggle-track"></span><span>Etkin</span></label>
          <p class="hint">Botun kanalda yönetici olması gerekir.</p>
        </div>
      </template>
      <div class="modal-foot"><button type="button" class="btn btn-ghost" @click="channel = null">Vazgeç</button><button class="btn btn-primary">Kaydet</button></div>
    </form>
  </div>
</section>
