<div x-data="commentsSection()" class="stack" @click.outside="menuFor = null">
  <!-- Durum kutuları (panelle aynı) -->
  <div class="status-tiles">
    <template x-for="s in statuses" :key="s.key">
      <button type="button" class="status-tile" :class="{ 'is-active': filters.status === s.key }" @click="setStatus(s.key)">
        <span class="status-icon" :class="'tone-' + s.tone">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path :d="s.icon"/></svg>
        </span>
        <span>
          <span class="status-count" x-text="count(s.key).toLocaleString('tr-TR')"></span>
          <span class="status-label" x-text="s.label"></span>
        </span>
      </button>
    </template>
  </div>

  <section class="card">
    <div class="toolbar">
      <input class="input toolbar-search" type="search" placeholder="Yorum, ad, e-posta, IP veya içerik başlığına göre ara…" x-model="search" @input="refilter(true)">
      <select class="input" x-model="filters.status" @change="refilter()">
        <option value="all">Tüm durumlar</option>
        <template x-for="s in statuses" :key="s.key"><option :value="s.key" x-text="s.label"></option></template>
      </select>
      <select class="input" x-model="filters.type" @change="refilter()">
        <option value="">Tüm türler</option>
        <template x-for="t in meta.types || []" :key="t.key"><option :value="t.key" x-text="t.label"></option></template>
      </select>
      <div class="toolbar-spacer"></div>
      <button type="button" class="icon-btn" title="Yenile" @click="reload()" :class="{ 'is-spinning': loading }">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M16.023 9.348h4.992V4.356M2.985 19.644v-4.992h4.992m0 0 3.181 3.183a8.25 8.25 0 0 0 13.803-3.7M4.031 9.865a8.25 8.25 0 0 1 13.803-3.7l3.181 3.182"/></svg>
      </button>
    </div>

    <p class="alert alert-error" x-show="listError" x-text="listError"></p>

    <div class="table-wrap" :class="{ 'is-loading': loading || busy }">
      <table class="table">
        <thead>
          <tr>
            <th>Yorum</th>
            <th>Yazar</th>
            <th>İçerik</th>
            <th>Durum</th>
            <th>Tarih</th>
            <th class="num">Yanıt</th>
            <th class="num">Beğeni</th>
            <th class="col-actions">İşlemler</th>
          </tr>
        </thead>
        <tbody>
          <template x-for="c in items" :key="c.id">
            <tr>
              <td class="col-comment">
                <button type="button" class="comment-link" @click="detail = c" :title="c.body">
                  <span class="muted" x-show="c.parent">↳ </span><span x-text="short(c.body)"></span>
                </button>
              </td>
              <td>
                <div class="cell-strong" x-text="c.author_name"></div>
                <template x-if="c.source !== 'site'">
                  <div class="source-badge" x-text="sourceLabel(c.source) + ' yorumu'"></div>
                </template>
                <template x-if="c.source === 'site'">
                  <div>
                    <div class="muted" x-text="c.author_email || ''"></div>
                    <div class="muted mono" x-text="c.author_ip || ''"></div>
                  </div>
                </template>
              </td>
              <td>
                <div class="cell-clip" :title="c.commentable_title" x-text="c.commentable_title || '—'"></div>
                <span class="badge badge-slate" x-text="c.commentable_type_label"></span>
              </td>
              <td><span class="badge" :class="statusBadge(c.status)" x-text="c.status_label"></span></td>
              <td class="nowrap" x-text="formatDate(c.created_at)"></td>
              <td class="num" x-text="c.reply_count"></td>
              <td class="num" x-text="c.likes"></td>
              <td class="col-actions">
                <div class="menu-wrap">
                  <button type="button" class="icon-btn" @click.stop="toggleMenu(c.id)" title="İşlemler">⋯</button>
                  <div class="row-menu" x-show="menuFor === c.id" x-transition.opacity @click.stop>
                    <button type="button" x-show="c.status !== 'approved'" @click="approve(c)">✔ Onayla</button>
                    <button type="button" x-show="c.status !== 'rejected'" @click="moderate(c, 'rejected')">✕ Reddet</button>
                    <button type="button" x-show="c.status !== 'spam'" @click="moderate(c, 'spam')">⚠ Spam</button>
                    <button type="button" x-show="c.status === 'approved'" @click="unapprove(c)">↺ Onayı Geri Al</button>
                    <button type="button" @click="openLogs(c)">☰ Geçmiş</button>
                    <hr>
                    <button type="button" class="is-danger" x-show="$store.auth.can('comments.bans.create')" @click="openBan(c)">⛔ Yasakla</button>
                    <button type="button" class="is-danger" x-show="$store.auth.can('comments.delete')" @click="remove(c)">🗑 Sil</button>
                  </div>
                </div>
              </td>
            </tr>
          </template>
          <tr x-show="loaded && !items.length"><td colspan="8" class="empty">Bu durumda yorum yok.</td></tr>
        </tbody>
      </table>
    </div>

    <!-- @include partials/pager -->
  </section>

  <!-- Yorum ayrıntısı -->
  <div class="modal-backdrop" x-show="detail" x-transition.opacity @keydown.escape.window="detail = null">
    <div class="modal" @click.outside="detail = null">
      <template x-if="detail">
        <div>
          <div class="modal-head"><h2 x-text="detail.author_name"></h2><button type="button" class="icon-btn" @click="detail = null">✕</button></div>
          <div class="modal-body detail-body">
            <div class="detail-meta">
              <span class="badge" :class="statusBadge(detail.status)" x-text="detail.status_label"></span>
              <span class="muted" x-text="formatDate(detail.created_at)"></span>
              <span class="muted mono" x-show="detail.author_ip" x-text="detail.author_ip"></span>
            </div>
            <blockquote class="reply-quote" x-show="detail.parent">
              <b x-text="detail.parent?.author_name"></b>
              <span x-text="detail.parent?.body"></span>
            </blockquote>
            <p class="detail-text" x-text="detail.body"></p>
            <div class="detail-meta">
              <span x-text="'👍 ' + detail.likes + '   👎 ' + detail.dislikes"></span>
              <span class="muted" x-text="detail.commentable_type_label + ': ' + (detail.commentable_title || '')"></span>
              <button type="button" class="link" x-show="detail.commentable_url" @click="copy(detail.commentable_url)">Adresi kopyala</button>
            </div>
          </div>
          <div class="modal-foot">
            <button type="button" class="btn btn-ghost" x-show="detail.status !== 'rejected'" @click="moderate(detail, 'rejected')">Reddet</button>
            <button type="button" class="btn btn-ghost" x-show="detail.status !== 'spam'" @click="moderate(detail, 'spam')">Spam</button>
            <button type="button" class="btn btn-primary" x-show="detail.status !== 'approved'" @click="approve(detail)">Onayla</button>
          </div>
        </div>
      </template>
    </div>
  </div>

  <!-- Moderasyon geçmişi -->
  <div class="modal-backdrop" x-show="logs !== null && logsFor" x-transition.opacity @keydown.escape.window="logs = null">
    <div class="modal" @click.outside="logs = null; logsFor = ''">
      <div class="modal-head"><h2 x-text="'Moderasyon Geçmişi — ' + logsFor"></h2><button type="button" class="icon-btn" @click="logs = null; logsFor = ''">✕</button></div>
      <div class="modal-body">
        <p class="empty" x-show="logs && !logs.length">Bu yorum için henüz bir moderasyon kaydı yok.</p>
        <ol class="timeline">
          <template x-for="(l, i) in logs || []" :key="i">
            <li>
              <span class="cell-strong" x-text="(l.from ? l.from + ' → ' : '') + l.to"></span>
              <span class="muted" x-text="formatDate(l.created_at)"></span>
              <span class="muted" x-show="l.reason" x-text="l.reason"></span>
            </li>
          </template>
        </ol>
      </div>
    </div>
  </div>

  <!-- Kimliği yasakla -->
  <div class="modal-backdrop" x-show="banTarget" x-transition.opacity @keydown.escape.window="banTarget = null">
    <form class="modal" @submit.prevent="confirmBan()">
      <div class="modal-head"><h2>Kimliği Yasakla</h2><button type="button" class="icon-btn" @click="banTarget = null">✕</button></div>
      <template x-if="banTarget">
        <div class="modal-body">
          <p class="hint hint-warn">Seçtiğiniz kimliğe ait <b>bekleyen</b> tüm yorumlar aynı işlemde reddedilir. Onaylanmış yorumlara dokunulmaz. Bu işlem bildirim göndermez.</p>
          <dl class="ban-grid">
            <div><dt>Yazar</dt><dd x-text="banTarget.author_name"></dd></div>
            <div><dt>IP adresi</dt><dd class="mono" x-text="banTarget.author_ip || '—'"></dd></div>
            <div><dt>E-posta</dt><dd x-text="banTarget.author_email || '—'"></dd></div>
          </dl>
          <label class="toggle"><input type="checkbox" x-model="ban.ban_ip" :disabled="!banTarget.author_ip"><span class="toggle-track"></span><span>IP adresini yasakla</span></label>
          <label class="toggle"><input type="checkbox" x-model="ban.ban_email" :disabled="!banTarget.author_email"><span class="toggle-track"></span><span>E-posta adresini yasakla</span></label>
          <label class="field"><span>Gerekçe <small class="muted">(isteğe bağlı)</small></span><textarea class="input" rows="3" x-model="ban.reason" maxlength="1000"></textarea></label>
        </div>
      </template>
      <div class="modal-foot">
        <button type="button" class="btn btn-ghost" @click="banTarget = null">Vazgeç</button>
        <button class="btn btn-danger" :disabled="busy || (!ban.ban_ip && !ban.ban_email)">Yasakla</button>
      </div>
    </form>
  </div>
</div>
