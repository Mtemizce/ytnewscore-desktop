<div class="modal-backdrop" x-show="authenticated && !locked && user?.must_change_password" x-transition.opacity>
  <form class="modal modal-sm" @submit.prevent="changeForcedPassword()">
    <div class="modal-head"><h2>Yeni Şifre Belirleyin</h2></div>
    <div class="modal-body">
      <p class="hint">Hesabınızın şifresi bir yönetici tarafından belirlendi. Devam etmek için kendi şifrenizi belirleyin.</p>
      <label class="field"><span>Mevcut (geçici) şifre</span><input class="input" type="password" x-model="forced.current_password" autocomplete="current-password" required></label>
      <label class="field"><span>Yeni şifre <small class="muted">(en az 8 karakter)</small></span><input class="input" type="password" x-model="forced.password" autocomplete="new-password" required></label>
      <label class="field"><span>Yeni şifre (tekrar)</span><input class="input" type="password" x-model="forced.password_confirmation" autocomplete="new-password" required></label>
      <p class="alert alert-error" x-show="forcedError" x-text="forcedError"></p>
    </div>
    <div class="modal-foot">
      <button type="button" class="btn btn-ghost" @click="logout()">Çıkış</button>
      <button class="btn btn-primary" :disabled="forcedSaving">Şifreyi Kaydet</button>
    </div>
  </form>
</div>
