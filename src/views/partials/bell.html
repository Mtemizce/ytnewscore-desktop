<div class="bell" @click.outside="bellOpen = false">
  <button type="button" class="icon-btn" @click="bellOpen = !bellOpen" title="Bildirimler">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M14.857 17.082a23.848 23.848 0 0 0 5.454-1.31A8.967 8.967 0 0 1 18 9.75V9A6 6 0 0 0 6 9v.75a8.967 8.967 0 0 1-2.312 6.022c1.733.64 3.56 1.085 5.455 1.31m5.714 0a24.255 24.255 0 0 1-5.714 0m5.714 0a3 3 0 1 1-5.714 0"/></svg>
    <span class="bell-count" x-show="unreadCount" x-text="unreadCount > 99 ? '99+' : unreadCount"></span>
  </button>

  <div class="dropdown" x-show="bellOpen" x-transition.opacity>
    <div class="dropdown-head">
      <span>Bildirimler</span>
      <div class="dropdown-head-actions">
        <button type="button" class="link" @click="testNotification">Dene</button>
        <button type="button" class="link" x-show="unreadCount" @click="markAllRead">Tümünü okundu say</button>
      </div>
    </div>
    <template x-if="!notifications.length">
      <p class="empty">Bildirim yok.</p>
    </template>
    <template x-for="n in notifications" :key="n.id">
      <button type="button" class="notice" :class="{ 'is-unread': !n.is_read }" @click="markRead(n)">
        <span class="notice-title" x-text="n.title"></span>
        <span class="notice-body" x-show="n.body" x-text="n.body"></span>
      </button>
    </template>
  </div>
</div>
