<div class="accounts">
  <header class="accounts-head">
    <div class="brand brand-dark">
      <span class="brand-mark">YT</span>
      <span>YTNews<b>Core</b> <small>Hesap seçin</small></span>
    </div>
    <div class="account-tools">
      <button type="button" class="link" x-show="active?.token" @click="lock()">Kilitle</button>
      <button type="button" class="link" @click="testNotification()">Bildirimi dene</button>
    </div>
  </header>

  <div class="account-grid">
    <template x-for="account in list" :key="account.id">
      <article class="account-card" :class="{ 'is-active': account.id === activeId, 'is-signed-out': !account.token }">
        <button type="button" class="account-cover" @click="open(account)" :disabled="opening !== null" :title="account.token ? 'Paneli aç' : 'Giriş yap'">
          <img class="account-photo" x-show="account.user?.avatar_url" :src="account.user?.avatar_url" alt="">
          <span class="account-initials" x-show="!account.user?.avatar_url" x-text="initials(account.user?.name)"></span>
          <span class="account-site" x-text="account.siteName || account.baseUrl"></span>
          <span class="account-badge" x-show="!account.token">Oturum kapalı</span>
          <span class="account-name">
            <b x-text="account.user?.name"></b>
            <small x-show="account.user?.title" x-text="account.user?.title"></small>
          </span>
        </button>

        <dl class="account-info">
          <div><dt>E-posta</dt><dd x-text="account.user?.email || '—'"></dd></div>
          <div><dt>Telefon</dt><dd x-text="account.user?.phone || '—'"></dd></div>
          <div><dt>Son oturum</dt><dd x-text="formatDate(account.lastOpenedAt)"></dd></div>
        </dl>

        <div class="account-foot">
          <button type="button" class="btn btn-primary btn-sm" @click="open(account)" :disabled="opening !== null"
                  x-text="opening === account.id ? 'Açılıyor…' : (account.token ? 'Paneli Aç' : 'Giriş Yap')"></button>
          <button type="button" class="btn btn-ghost-danger btn-sm" title="Bu bilgisayardan kaldır" @click="removeAccount(account)">Kaldır</button>
        </div>
      </article>
    </template>

    <button type="button" class="account-card account-add" @click="startAdd()">
      <span class="account-add-icon">+</span>
      <span>Hesap Ekle</span>
    </button>
  </div>
</div>
